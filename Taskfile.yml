# Taskfile.yml - small workspace entrypoints.
# Inputs: cgenv and release tasks forward CLI_ARGS; smoke accepts its timeout.
# Side effects: tasks open VS Code, build release output, or run test resources.
# Related files: scripts/cgenv, tools/build-release.sh, and tests/smoke/run.sh

version: '3'

tasks:
  cgenv:
    desc: Open a remote directory in VS Code
    cmd: ./scripts/cgenv {{.CLI_ARGS}}

  smoke:
    desc: Run the graphical VS Code Remote - SSH smoke test
    cmd: ./tests/smoke/run.sh

  release-build:
    desc: Build installable script release assets
    cmd: ./tools/build-release.sh {{.CLI_ARGS}}

  release-test:
    desc: Test release assets and the streamed installer
    cmd: ./tests/release.sh {{.CLI_ARGS}}
