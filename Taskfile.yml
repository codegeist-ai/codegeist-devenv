# Taskfile.yml - small workspace entrypoints.
# Inputs: `cgenv` forwards CLI_ARGS; `smoke` accepts CGENV_SMOKE_TIMEOUT_SECONDS.
# Side effects: cgenv opens VS Code; smoke builds disposable Docker resources.
# Related files: scripts/cgenv and tests/smoke/run.sh

version: '3'

tasks:
  cgenv:
    desc: Open a remote directory in VS Code
    cmd: ./scripts/cgenv {{.CLI_ARGS}}

  smoke:
    desc: Run the graphical VS Code Remote - SSH smoke test
    cmd: ./tests/smoke/run.sh
